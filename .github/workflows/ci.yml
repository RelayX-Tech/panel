name: ci

# design.md §1.3-14 / §6：格式化 → 静态检查 → 单元 → 集成 → 构建。
# 迁移由集成测试在独立库内自行执行（testsupport.NewPostgres），无需预置 schema。
# STO-002 起 Panel 依赖 contracts（未发布 tag）：CI 并列 checkout + go.work 组装。
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: relayx
          POSTGRES_PASSWORD: relayx
          POSTGRES_DB: relayx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relayx -d relayx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      RELAYX_TEST_DSN: postgres://relayx:relayx@127.0.0.1:5432/relayx_test?sslmode=disable
      RELAYX_DB_DSN: postgres://relayx:relayx@127.0.0.1:5432/relayx_test?sslmode=disable
      REDIS_ADDR: 127.0.0.1:6379

    steps:
      - name: checkout panel
        uses: actions/checkout@v4

      - name: checkout contracts
        uses: actions/checkout@v4
        with:
          repository: relayx-tech/contracts
          path: contracts
          token: ${{ secrets.RELAYX_CI_TOKEN || github.token }}

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: assemble workspace
        run: go work init . ./contracts

      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w .："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # OPS-1：迁移门禁——CLI 入口可 up / status，且迁移文件（含 auth_password_audits）可干净应用。
      # 契约生成物一致性由 tests/integration 的 TestAPIContractValidates /
      # TestSwaggerArtifactMatchesContract 覆盖，无需重复步骤。
      - name: migrate up + status
        run: |
          go run . migrate up
          go run . migrate status

      - name: unit tests
        run: go test ./internal/... ./cmd/... -count=1

      # 集成测试要求 PostgreSQL + Redis；连接不上时 testsupport 会 Skip，
      # 因此 service health 是这组用例真实执行的前提。
      - name: integration tests
        run: go test ./tests/integration/... -count=1 -v
