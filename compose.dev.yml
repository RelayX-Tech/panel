services:
  postgres:
    image: postgres:16.4
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-relayx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-relayx}
    volumes: [relayx_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes: [relayx_redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  relayx_pgdata: {}
  relayx_redisdata: {}
