Name: panel-api
Host: 0.0.0.0
Port: 8888

Auth:
  SessionCookieName: relayx_session
  SessionIdleTTL: 24h
  SessionAbsoluteTTL: 168h
  SessionTouchInterval: 5m
  CookieSecure: true          # 开发环境置 false
  AllowedOrigins:
    - http://localhost:3000
    - http://127.0.0.1:3000
  LoginRateLimit:
    Window: 60s
    MaxAttempts: 10
  # 修改密码旧密码错误限流（按用户 ID，独立于登录限流；design.md §4.2）。
  PasswordChangeRateLimit:
    Window: 15m
    MaxAttempts: 5
  TrustProxyHeaders: false    # 启用时按 TrustedProxyCIDRs 解析 X-Forwarded-For
  TrustedProxyCIDRs: []

Database:
  # 生产环境经环境变量 RELAYX_DB_DSN 覆盖，不提交真实凭据。
  DataSource: postgres://relayx:relayx@127.0.0.1:55432/relayx?sslmode=disable
  MaxOpenConns: 20
  MaxIdleConns: 10
  ConnMaxLifetime: 1h

# sqlcache 后端（与 compose.dev.yml 的 redis:7.4 / 端口 56379 对齐）。
Cache:
  - Host: 127.0.0.1:56379
    Type: node

# STO-002 下发编排客户端（端点为空则对应客户端禁用；仅用于 readyz / 内部调用）。
CoreControl:
  Endpoints: ["127.0.0.1:9000"]
  Timeout: 35s
  Insecure: true          # 生产置 false 并配置 CertFile/KeyFile/CAFile/ServerName
  # CertFile: /etc/relayx/tls/panel-client.crt
  # KeyFile: /etc/relayx/tls/panel-client.key
  # CAFile: /etc/relayx/tls/core-control-ca.crt
  # ServerName: core-control
Agent:
  Endpoints: []           # 每节点地址，如 ["node1.example.com:9100"]
  Timeout: 35s
  Insecure: true

# STO-002 节点注册 gRPC 服务（design §3.10）；需 Panel CA 与 RELAYX_MASTER_KEY。
Registration:
  Enabled: false
  ListenOn: 127.0.0.1:9101
  Insecure: true          # 生产置 false 并配置 CertFile/KeyFile/CAFile
  # CertFile: /etc/relayx/tls/registration.crt
  # KeyFile: /etc/relayx/tls/registration.key
  # CAFile: /etc/relayx/tls/panel-ca.crt
  # CACertFile: /etc/relayx/tls/panel-ca.crt
  # CAKeyFile: /etc/relayx/tls/panel-ca.key
