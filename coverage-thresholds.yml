# 覆盖率门禁基线（棘轮）
# 每包阈值 = 引入门禁时的当前覆盖率（向下取整到 0.1%），只升不降。
# 覆盖率改进后运行 `task panel:coverage:update` 重新生成。
# 排除 goctl 生成的薄适配层（internal/handler/**）与测试辅助（internal/testsupport）。
